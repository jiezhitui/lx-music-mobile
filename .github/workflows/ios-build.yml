name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS Archive & Package IPA
        run: |
          cd ios
          WORKSPACE_NAME=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_NAME" .xcworkspace)
          
          echo "Found workspace: $WORKSPACE_NAME"
          echo "Using scheme: $SCHEME_NAME"

          set -o pipefail
          xcodebuild -workspace "$WORKSPACE_NAME" \
                     -scheme "$SCHEME_NAME" \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath ./build/lx_music_mobile.xcarchive \
                     archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

          mkdir -p ./build/Payload
          cp -r ./build/lx_music_mobile.xcarchive/Products/Applications/*.app ./build/Payload/
          cd build
          zip -r lx-music-mobile-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-mobile-ios-ipa
          path: ios/build/lx-music-mobile-unsigned.ipa
